[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cst-renderai"
version = "1.0.0"
description = "Render tecnici con riferimenti documentali e Codex ChatGPT"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9,<7"]

[project.scripts]
cst-renderai = "cst_renderai.app:main"

[tool.setuptools.packages.find]
include = ["cst_renderai*"]
